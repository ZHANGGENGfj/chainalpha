name: financial-evidence-research
description: Select and execute source-scoped evidence collection for listed-company research.
research_types: [company]
source_priority: [exchange_filing, company_disclosure, regulator, structured_financial_api, mainstream_media, broker_research]
sources:
  - name: local_financial_archive
    tool: local_search
    description: Search local announcements, financial reports, broker reports and remembered evidence.
    local_platforms: [cninfo_reports, broker_reports, finance_news, claim_tasks]
  - name: finance_news_crawl
    tool: targeted_news_crawl
    description: Run a targeted query through the configured finance-news MediaCrawler sources.
    media_crawler_platform: finance_news
    local_platforms: [finance_news]
capabilities:
  - name: recent_events
    description: Recent news, orders, products and technology progress.
    required: true
    max_age_days: 30
    evidence_hints: [最新, 订单, 产品进展, 技术进展, 事件]
    evidence_groups: [[最新, 订单, 产品进展, 技术进展, 事件]]
    query_templates: ["{target} {ticker} 最新新闻 订单 产品 技术进展"]
    tools: [local_search, targeted_news_crawl]
    source_profiles: [local_financial_archive, finance_news_crawl]
  - name: announcements
    description: Company announcements, periodic reports and material-event evidence.
    required: true
    evidence_hints: [公告, 年报, 季报, 交易所, cninfo, 定期报告]
    evidence_groups: [[公告, 年报, 季报, 交易所, cninfo, 定期报告]]
    query_templates: ["{target} {ticker} 最新公告 年报 季报 重大事项"]
    tools: [local_search, targeted_news_crawl]
    source_profiles: [local_financial_archive, finance_news_crawl]
  - name: financial_core
    description: Revenue, profit, gross margin and other core financial facts.
    required: true
    evidence_hints: [营业收入, 营收, 净利润, 归母, 毛利率]
    evidence_groups: [[营业收入, 营收], [净利润, 归母], [毛利率]]
    query_templates:
      - "{target} {ticker} 最新财报 营业收入 归母净利润 扣非净利润 毛利率"
      - "{target} {ticker} 财务分析 收入 利润 毛利率"
    tools: [local_search, targeted_news_crawl]
    source_profiles: [local_financial_archive, finance_news_crawl]
  - name: working_capital
    description: Cash flow, inventory, receivables, capex and research spending evidence.
    required: true
    evidence_hints: [经营现金流, 现金流, 存货, 应收账款, 在建工程]
    evidence_groups: [[经营现金流, 现金流], [存货], [应收账款]]
    query_templates: ["{target} {ticker} 经营现金流 存货 应收账款 在建工程 研发费用"]
    tools: [local_search, targeted_news_crawl]
    source_profiles: [local_financial_archive, finance_news_crawl]
  - name: business_structure
    description: Business mix, customers, suppliers and geographic revenue evidence.
    required: true
    evidence_hints: [主营业务, 分产品, 客户, 供应商, 地区收入]
    evidence_groups: [[主营业务, 分产品], [客户, 供应商]]
    query_templates: ["{target} {ticker} 主营业务 分产品收入 分地区收入 前五大客户 供应商"]
    tools: [local_search, targeted_news_crawl]
    source_profiles: [local_financial_archive, finance_news_crawl]
  - name: market_data
    description: Point-in-time market price, valuation and capital-flow evidence.
    required: false
    evidence_hints: [股价, 市值, 市盈率, pe, pb, 资金流向, 两融]
    query_templates: ["{target} {ticker} 最新股价 市值 PE PB 资金流向 两融"]
    tools: [local_search, targeted_news_crawl]
    source_profiles: [local_financial_archive, finance_news_crawl]
